<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="cpoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122b07" />
      <stop offset="100%" stop-color="#1b3d0d" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39223" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="cpoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Pill -->
  <rect x="2" y="2" width="236" height="52" rx="26" fill="url(#cpoBg)" stroke="rgba(75, 143, 36, 0.45)" stroke-width="2" filter="url(#cpoShadow)" />
  
  <!-- Left circular icon badge -->
  <g transform="translate(6, 6)">
    <circle cx="22" cy="22" r="20" fill="#4b8f24" />
    <!-- Circular Arrow / Eco Loop -->
    <path d="M22 10 A12 12 0 0 1 34 22 L31 22 A9 9 0 0 0 22 13 Z" fill="#ffffff" />
    <path d="M22 34 A12 12 0 0 1 10 22 L13 22 A9 9 0 0 0 22 31 Z" fill="#ffffff" />
    <polygon points="34,17 38,23 32,23" fill="#ffffff" />
    <polygon points="10,27 6,21 12,21" fill="#ffffff" />
    <!-- Leaf in center -->
    <path d="M22 16 C26 19 26 25 22 28 C18 25 18 19 22 16 Z" fill="url(#goldAcc)" />
  </g>
  
  <!-- Text Label -->
  <g transform="translate(56, 12)">
    <!-- Top row: FITFORM CPO -->
    <text x="0" y="14" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" letter-spacing="0.8px">
      FITFORM <tspan fill="url(#goldAcc)">CPO</tspan>
    </text>
    <!-- Certified dot -->
    <circle cx="122" cy="10" r="3.2" fill="#4ade80" />
    <text x="130" y="13.5" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" fill="#a7f3d0" letter-spacing="0.5px">
      GEKEURD
    </text>
    <!-- Bottom row: CIRCULAIR GERECONDITIONEERD -->
    <text x="0" y="29" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0" letter-spacing="0.4px">
      CIRCULAIR GERECONDITIONEERD
    </text>
  </g>
</svg>