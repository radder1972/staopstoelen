<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250">
<defs>
 <style>
  /* Statische weergave voor het logo: rustig, solide en zonder continue animatie */
  .wedge-lift {
   transform-origin: 120px 218px;
   transform: scaleY(.38);
  }
  .frame-lift {
   transform-origin: 120px 180px;
   transform: translateY(6px);
  }
  .seat-tilt {
   transform-origin: 120px 172px;
   transform: translateY(6px) scaleY(.78);
  }
  .back-tilt {
   transform-origin: 120px 148px;
   transform: translateY(6px) scale(1, 1);
  }
  .head-tilt {
   transform-origin: 120px 36px;
   transform: translateY(0) scale(1);
  }
  .arrow-lift {
   transform-origin: 120px 140px;
   transform: translateY(4px) scale(.97);
   opacity: .88;
  }
  .btn-glow {
   fill: #ffc247;
   r: 2.8px;
  }
 </style>
 <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd65a"/><stop offset=".55" stop-color="#4b8f24"/><stop offset="1" stop-color="#234f11"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ab13c"/><stop offset="1" stop-color="#2e6819"/></linearGradient>
 <linearGradient id="a2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2e6819"/><stop offset="1" stop-color="#6ab13c"/></linearGradient>
 <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4ec89"/><stop offset=".45" stop-color="#6ab13c"/><stop offset="1" stop-color="#35731c"/></linearGradient>
 <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35731c"/><stop offset="1" stop-color="#122b07"/></linearGradient>
 <linearGradient id="sw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#dc8019"/><stop offset=".55" stop-color="#f39223"/><stop offset="1" stop-color="#fed857"/></linearGradient>
 <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="c"><path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z"/></clipPath>
</defs>

<!-- Vloerschaduw -->
<ellipse cx="120" cy="239" rx="102" ry="9" fill="url(#sh)"/>

<!-- Vaste horizontale vloerplaat op de grond -->
<rect x="44" y="218" width="152" height="12" rx="6" fill="#122b07"/>
<rect x="58" y="226" width="22" height="9" rx="4" fill="#0b1c04"/>
<rect x="160" y="226" width="22" height="9" rx="4" fill="#0b1c04"/>

<!-- Rustig onderstel -->
<g class="wedge-lift">
 <path d="M52 218L58 176L182 176L188 218Z" fill="url(#f)"/>
 <path d="M66 208L174 208M68 194L172 194" stroke="#8fd65a" stroke-opacity=".36" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Rugleuning -->
<g class="back-tilt">
 <path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z" fill="url(#b)"/>
 <g clip-path="url(#c)" stroke="#fff" stroke-opacity=".32" stroke-width="2.2" fill="none">
  <path d="M-50 14L50 140M50 14L-50 140"/><path d="M-30 14L70 140M70 14L-30 140"/><path d="M-10 14L90 140M90 14L-10 140"/>
  <path d="M10 14L110 140M110 14L10 140"/><path d="M30 14L130 140M130 14L30 140"/><path d="M50 14L150 140M150 14L50 140"/>
  <path d="M70 14L170 140M170 14L70 140"/><path d="M90 14L190 140M190 14L90 140"/><path d="M110 14L210 140M210 14L110 140"/>
  <path d="M130 14L230 140M230 14L130 140"/><path d="M150 14L250 140M250 14L150 140"/><path d="M170 14L270 140M270 14L170 140"/>
 </g>
 <g clip-path="url(#c)" fill="#fff" fill-opacity=".85">
  <circle cx="100" cy="62" r="2.8"/><circle cx="140" cy="62" r="2.8"/>
  <circle cx="120" cy="86" r="2.8"/>
  <circle cx="100" cy="110" r="2.8"/><circle cx="140" cy="110" r="2.8"/>
  <circle cx="120" cy="132" r="2.8"/>
 </g>
 <!-- Zacht ergonomisch nekkussen -->
 <g class="head-tilt">
  <rect x="78" y="18" width="84" height="30" rx="14" fill="url(#s)" stroke="#234f11" stroke-width="2"/>
  <path d="M88 24h64" stroke="#fff" stroke-opacity=".68" stroke-width="2.5" stroke-linecap="round"/>
 </g>
</g>

<!-- Zitvlak -->
<g class="seat-tilt">
 <path d="M60 138Q120 120 180 138L188 172H52z" fill="url(#s)"/>
 <path d="M60 140Q120 124 180 140" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Armwangen, voorfront & zijvak met afstandsbediening -->
<g class="frame-lift">
 <rect x="24" y="92" width="44" height="114" rx="18" fill="url(#a)"/>
 <rect x="172" y="92" width="44" height="114" rx="18" fill="url(#a2)"/>
 <rect x="28" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".35"/>
 <rect x="176" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".28"/>

 <!-- Beensteun / voetenklep voorzijde -->
 <rect x="52" y="164" width="136" height="42" rx="14" fill="url(#b)"/>
 <rect x="64" y="171" width="112" height="26" rx="9" fill="url(#f)" fill-opacity=".45"/>

 <!-- Zijvak met handbediening -->
 <path d="M29 148h32v38a8 8 0 0 1-8 8H37a8 8 0 0 1-8-8z" fill="#1d460d" fill-opacity=".55" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
 <rect x="36" y="132" width="18" height="28" rx="6" fill="#122b07" stroke="#fff" stroke-width="1.8"/>
 <circle class="btn-glow" cx="45" cy="141" r="2.8" fill="#fed857"/>
 <circle cx="45" cy="150" r="2.8" fill="#8fd65a"/>
</g>

<!-- Gouden "Sta-Op" pijl-swoosh -->
<g class="arrow-lift">
 <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="#000" opacity=".18" transform="translate(0 5)"/>
 <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="url(#sw)" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
</g>
</svg>
