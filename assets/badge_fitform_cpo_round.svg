<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cpoRoundBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122b07" />
      <stop offset="100%" stop-color="#1d3d0c" />
    </linearGradient>
    <linearGradient id="cpoGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39223" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="cpoRoundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#cpoRoundBg)" stroke="#4b8f24" stroke-width="2.5" filter="url(#cpoRoundShadow)" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(243, 146, 35, 0.45)" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Center Circular Arrows -->
  <g transform="translate(50, 48)">
    <!-- Top arc -->
    <path d="M-18,-6 A20,20 0 0,1 18,-6" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="18,-11 23,-5 16,-3" fill="#4ade80" />
    <!-- Bottom arc -->
    <path d="M18,6 A20,20 0 0,1 -18,6" fill="none" stroke="url(#cpoGold)" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="-18,11 -23,5 -16,3" fill="url(#cpoGold)" />
  </g>

  <!-- Central Text -->
  <text x="50" y="44" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="0.5px">
    FITFORM
  </text>
  <text x="50" y="58" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="url(#cpoGold)" letter-spacing="1px">
    CPO
  </text>
  <text x="50" y="72" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="800" fill="#a7f3d0" letter-spacing="0.4px">
    CIRCULAIR
  </text>
</svg>