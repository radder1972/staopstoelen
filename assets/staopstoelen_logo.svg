<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 110px;
        letter-spacing: -3px;
        fill: #2e6819;
      }
      .brand-nl {
        fill: #f39223;
      }
      .brand-sub {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 5px;
        fill: #626a63;
      }
      .sub-dot {
        fill: #f39223;
      }
    </style>
  </defs>
  <!-- Brand liquid swooshes -->
  <g id="swooshes">
    <path d="M 50,75 Q 300,140 550,85 T 950,95" stroke="#bce4f2" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 50,95 Q 300,55 550,105 T 950,115" stroke="#f39223" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 50,110 Q 300,150 550,100 T 950,125" stroke="#6ab13c" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 50,126 Q 300,85 550,130 T 950,135" stroke="#2e6819" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="500" y="225" text-anchor="middle" class="brand-title">staopstoelen<tspan class="brand-nl">.nl</tspan></text>
  <text x="500" y="278" text-anchor="middle" class="brand-sub">ZITSPECIALIST <tspan class="sub-dot">•</tspan> DORDRECHT</text>
</svg>
