<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250">
<defs>
 <style>
  /* De Grote Sta-Op Stoel Dans (actief na dubbelklik) */
  .shadow-dance {
   transform-origin: 120px 239px;
   animation: danceShadow 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .base-dance {
   transform-origin: 120px 224px;
   animation: danceBase 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .wedge-lift {
   transform-origin: 120px 218px;
   animation: danceWedge 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .frame-lift {
   transform-origin: 120px 165px;
   animation: danceFrame 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .seat-tilt {
   transform-origin: 120px 168px;
   animation: danceSeat 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .back-tilt {
   transform-origin: 120px 145px;
   animation: danceBack 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .head-tilt {
   transform-origin: 120px 34px;
   animation: danceHead 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .arrow-lift {
   transform-origin: 120px 135px;
   animation: danceArrow 3.2s cubic-bezier(.36, .07, .19, .97) infinite;
  }
  .btn-glow {
   animation: danceDisco1 0.4s steps(2, end) infinite;
  }
  .btn-glow2 {
   animation: danceDisco2 0.4s steps(2, end) infinite;
  }
  .note-1 {
   animation: floatNote1 1.6s ease-out infinite;
  }
  .note-2 {
   animation: floatNote2 1.6s ease-out 0.45s infinite;
  }
  .note-3 {
   animation: floatNote3 1.6s ease-out 0.9s infinite;
  }

  @keyframes danceShadow {
   0%, 100% { transform: scaleX(1); opacity: 1; }
   10%, 30% { transform: translateX(-8px) scaleX(1.08); }
   20%, 40% { transform: translateX(8px) scaleX(1.08); }
   50%, 66% { transform: scaleX(.55); opacity: .5; }
   76% { transform: scaleX(1.18); opacity: 1; }
   86% { transform: scaleX(.92); }
  }
  @keyframes danceBase {
   0%, 44%, 76%, 100% { transform: translateY(0) rotate(0deg); }
   52% { transform: translateY(-10px) rotate(-6deg); }
   64% { transform: translateY(-12px) rotate(6deg); }
  }
  @keyframes danceWedge {
   0%, 100% { transform: scaleY(.55) skewX(0deg); }
   10%, 30% { transform: scaleY(.95) skewX(-10deg); }
   15%, 35% { transform: scaleY(.35) skewX(0deg); }
   20%, 40% { transform: scaleY(.95) skewX(10deg); }
   50%, 66% { transform: scaleY(1.25) skewX(0deg); }
   76% { transform: scaleY(.32); }
   86% { transform: scaleY(1.12); }
  }
  @keyframes danceFrame {
   0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
   10%, 30% { transform: translate(-10px, -10px) rotate(-9deg) scale(1.06, .95); }
   15%, 35% { transform: translate(0, 6px) rotate(0deg) scale(1.08, .9); }
   20%, 40% { transform: translate(10px, -10px) rotate(9deg) scale(1.06, .95); }
   52% { transform: translate(-6px, -22px) rotate(-12deg) scale(.94, 1.08); }
   64% { transform: translate(6px, -24px) rotate(12deg) scale(.94, 1.08); }
   76% { transform: translate(0, 8px) scale(1.1, .88); }
   86% { transform: translate(0, -14px) scale(1.03, 1.02); }
  }
  @keyframes danceSeat {
   0%, 100% { transform: translate(0, 0) rotate(0deg) scaleY(1); }
   10%, 30% { transform: translate(-10px, -12px) rotate(-8deg) scaleY(1.35); }
   15%, 35% { transform: translate(0, 6px) rotate(0deg) scaleY(.75); }
   20%, 40% { transform: translate(10px, -12px) rotate(8deg) scaleY(1.35); }
   52%, 64% { transform: translate(0, -24px) scaleY(1.55); }
   76% { transform: translate(0, 8px) scaleY(.72); }
   86% { transform: translate(0, -16px) scaleY(1.75); }
  }
  @keyframes danceBack {
   0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
   10%, 30% { transform: translate(-12px, -14px) rotate(-11deg) scale(1.05, .94); }
   15%, 35% { transform: translate(0, 6px) rotate(0deg) scale(1.06, .92); }
   20%, 40% { transform: translate(12px, -14px) rotate(11deg) scale(1.05, .94); }
   52% { transform: translate(-8px, -26px) rotate(-14deg) scale(.92, 1.06); }
   64% { transform: translate(8px, -26px) rotate(14deg) scale(.92, 1.06); }
   76% { transform: translate(0, 8px) scale(1.08, .88); }
   86% { transform: translate(0, -20px) scale(1.06, .82); }
  }
  @keyframes danceHead {
   0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
   10%, 30% { transform: translate(10px, 3px) rotate(14deg) scale(1.08); }
   15%, 35% { transform: translate(0, -3px) rotate(0deg) scale(.96); }
   20%, 40% { transform: translate(-10px, 3px) rotate(-14deg) scale(1.08); }
   52% { transform: translate(8px, -4px) rotate(16deg) scale(1.1); }
   64% { transform: translate(-8px, -4px) rotate(-16deg) scale(1.1); }
   86% { transform: translate(0, 8px) scale(1.1, 1.14); }
  }
  @keyframes danceArrow {
   0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
   10%, 30% { transform: translate(-6px, -10px) rotate(-8deg) scale(1.06); }
   20%, 40% { transform: translate(6px, -10px) rotate(8deg) scale(1.06); }
   58% { transform: translate(0, -18px) rotate(-12deg) scale(1.12); }
   86% { transform: translate(0, -10px) scale(1.08); }
  }
  @keyframes danceDisco1 {
   0% { fill: #ffc247; r: 4px; }
   50% { fill: #ffffff; r: 2.5px; }
  }
  @keyframes danceDisco2 {
   0% { fill: #8fd65a; r: 2.5px; }
   50% { fill: #fed857; r: 4px; }
  }
  @keyframes floatNote1 {
   0% { transform: translate(32px, 75px) scale(.5) rotate(-10deg); opacity: 0; }
   25% { opacity: 1; }
   100% { transform: translate(12px, 14px) scale(1.15) rotate(-22deg); opacity: 0; }
  }
  @keyframes floatNote2 {
   0% { transform: translate(188px, 68px) scale(.5) rotate(8deg); opacity: 0; }
   25% { opacity: 1; }
   100% { transform: translate(210px, 10px) scale(1.15) rotate(24deg); opacity: 0; }
  }
  @keyframes floatNote3 {
   0% { transform: translate(118px, 42px) scale(.5) rotate(0deg); opacity: 0; }
   25% { opacity: 1; }
   100% { transform: translate(124px, -2px) scale(1.1) rotate(-14deg); opacity: 0; }
  }
 </style>
 <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd65a"/><stop offset=".55" stop-color="#4b8f24"/><stop offset="1" stop-color="#234f11"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ab13c"/><stop offset="1" stop-color="#2e6819"/></linearGradient>
 <linearGradient id="a2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2e6819"/><stop offset="1" stop-color="#6ab13c"/></linearGradient>
 <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4ec89"/><stop offset=".45" stop-color="#6ab13c"/><stop offset="1" stop-color="#35731c"/></linearGradient>
 <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35731c"/><stop offset="1" stop-color="#122b07"/></linearGradient>
 <linearGradient id="sw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#dc8019"/><stop offset=".55" stop-color="#f39223"/><stop offset="1" stop-color="#fed857"/></linearGradient>
 <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="c"><path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z"/></clipPath>
</defs>

<!-- Vloerschaduw danst mee -->
<ellipse class="shadow-dance" cx="120" cy="239" rx="102" ry="9" fill="url(#sh)"/>

<!-- Vloerplaat -->
<g class="base-dance">
 <rect x="44" y="218" width="152" height="12" rx="6" fill="#122b07"/>
 <rect x="58" y="226" width="22" height="9" rx="4" fill="#0b1c04"/>
 <rect x="160" y="226" width="22" height="9" rx="4" fill="#0b1c04"/>
</g>

<!-- Hef-onderstel -->
<g class="wedge-lift">
 <path d="M52 218L58 176L182 176L188 218Z" fill="url(#f)"/>
 <path d="M66 208L174 208M68 194L172 194" stroke="#8fd65a" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Rugleuning -->
<g class="back-tilt">
 <path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z" fill="url(#b)"/>
 <g clip-path="url(#c)" stroke="#fff" stroke-opacity=".34" stroke-width="2.2" fill="none">
  <path d="M-50 14L50 140M50 14L-50 140"/><path d="M-30 14L70 140M70 14L-30 140"/><path d="M-10 14L90 140M90 14L-10 140"/>
  <path d="M10 14L110 140M110 14L10 140"/><path d="M30 14L130 140M130 14L30 140"/><path d="M50 14L150 140M150 14L50 140"/>
  <path d="M70 14L170 140M170 14L70 140"/><path d="M90 14L190 140M190 14L90 140"/><path d="M110 14L210 140M210 14L110 140"/>
  <path d="M130 14L230 140M230 14L130 140"/><path d="M150 14L250 140M250 14L150 140"/><path d="M170 14L270 140M270 14L170 140"/>
 </g>
 <g clip-path="url(#c)" fill="#fff" fill-opacity=".88">
  <circle cx="100" cy="62" r="2.8"/><circle cx="140" cy="62" r="2.8"/>
  <circle cx="120" cy="86" r="2.8"/>
  <circle cx="100" cy="110" r="2.8"/><circle cx="140" cy="110" r="2.8"/>
  <circle cx="120" cy="132" r="2.8"/>
 </g>
 <!-- Nekkussen -->
 <g class="head-tilt">
  <rect x="78" y="18" width="84" height="30" rx="14" fill="url(#s)" stroke="#234f11" stroke-width="2"/>
  <path d="M88 24h64" stroke="#fff" stroke-opacity=".68" stroke-width="2.5" stroke-linecap="round"/>
 </g>
</g>

<!-- Zitvlak -->
<g class="seat-tilt">
 <path d="M60 138Q120 120 180 138L188 172H52z" fill="url(#s)"/>
 <path d="M60 140Q120 124 180 140" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Armwangen, voorfront & zijvak -->
<g class="frame-lift">
 <rect x="24" y="92" width="44" height="114" rx="18" fill="url(#a)"/>
 <rect x="172" y="92" width="44" height="114" rx="18" fill="url(#a2)"/>
 <rect x="28" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".35"/>
 <rect x="176" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".28"/>
 <rect x="52" y="164" width="136" height="42" rx="14" fill="url(#b)"/>
 <rect x="64" y="171" width="112" height="26" rx="9" fill="url(#f)" fill-opacity=".45"/>
 <path d="M29 148h32v38a8 8 0 0 1-8 8H37a8 8 0 0 1-8-8z" fill="#1d460d" fill-opacity=".55" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
 <rect x="36" y="132" width="18" height="28" rx="6" fill="#122b07" stroke="#fff" stroke-width="1.8"/>
 <circle class="btn-glow" cx="45" cy="141" r="2.8" fill="#fed857"/>
 <circle class="btn-glow2" cx="45" cy="150" r="2.8" fill="#8fd65a"/>
</g>

<!-- Gouden "Sta-Op" pijl-swoosh -->
<g class="arrow-lift">
 <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="#000" opacity=".18" transform="translate(0 5)"/>
 <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="url(#sw)" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
</g>

<!-- Vrolijke huisstijl muzieknootjes tijdens het dansen -->
<g class="note-1">
 <circle cx="6" cy="18" r="5" fill="#f39223" stroke="#fff" stroke-width="1.5"/>
 <path d="M10 18V2l10 3v5l-10-3" fill="#f39223" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<g class="note-2">
 <circle cx="5" cy="18" r="4.5" fill="#6ab13c" stroke="#fff" stroke-width="1.5"/>
 <circle cx="19" cy="15" r="4.5" fill="#6ab13c" stroke="#fff" stroke-width="1.5"/>
 <path d="M9 18V3l14-3v15" fill="none" stroke="#6ab13c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="note-3">
 <path d="M10 0L13 7L20 10L13 13L10 20L7 13L0 10L7 7Z" fill="#ffc247" stroke="#fff" stroke-width="1.2"/>
</g>
</svg>
