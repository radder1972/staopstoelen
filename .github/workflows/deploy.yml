name: Deploy naar Live Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Code ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔢 Versienummer automatisch synchroniseren
        run: |
          python3 scripts/sync_version.py

      - name: 🔑 Gemini API Sleutel configureren
        run: |
          echo "<?php define('GEMINI_API_KEY', '${{ secrets.GEMINI_API_KEY }}'); define('GEMINI_MODEL', 'gemini-2.5-flash');" > api/gemini_secret.php

      - name: 📂 Bestanden synchroniseren naar live server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.schippercompactwonen.nl
          username: matthias@schippercompactwonen.nl
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/staopstoelen.nl/public_html/
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/scratch/**
            **/.env*
            package*.json
            database.json
